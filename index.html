<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The wedding invitation is coming soon</title>
<meta name="description" content="Our wedding invitation is coming soon.">

<!-- Sharing preview. Replace yourdomain.com with your real domain so the photo
     shows up when the link is sent on WhatsApp, Instagram or Messenger. -->
<meta property="og:type" content="website">
<meta property="og:title" content="The wedding invitation is coming soon">
<meta property="og:description" content="Our wedding invitation is coming soon.">
<meta property="og:image" content="https://yourdomain.com/couple.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..600,0..100,0..1&family=Karla:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    /* Palette read off the fern print on the kimono */
    --f1:#4A9B85;   /* frond teal */
    --f2:#8E71B8;   /* frond violet */
    --f3:#C3D072;   /* frond chartreuse */
    --f4:#6B9450;   /* frond olive */
    --f5:#E8BC72;   /* frond gold */

    --ground:#102420;      /* deep forest ink */
    --ground-deep:#08150F;
    --paper:#F5F0E4;
    --sun:#F2C075;

    --aw:min(clamp(230px, 58vw, 380px), 36vh);   /* arch width, height-aware */
  }

  *{box-sizing:border-box}

  html,body{height:100%}

  body{
    margin:0;
    overflow-x:hidden;
    background:var(--ground-deep);
    color:var(--paper);
    font-family:"Karla",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(56px,13vh,120px) 20px clamp(32px,7vh,72px);
    min-height:100svh;
  }

  /* Backlight — the same low sun that's coming through the trees in the photo */
  .halo{
    position:fixed;
    left:50%; top:42%;
    width:min(1100px,150vw); aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,
      rgba(242,192,117,.28) 0%,
      rgba(242,192,117,.10) 32%,
      rgba(16,36,32,0) 66%);
    pointer-events:none;
    animation:breathe 11s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.85; transform:translate(-50%,-50%) scale(1)}
    50%    {opacity:1;   transform:translate(-50%,-50%) scale(1.06)}
  }

  /* Vignette so the type stays legible over the glow */
  .grain{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%,
      rgba(8,21,15,0) 30%, rgba(8,21,15,.55) 100%);
  }

  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(30px,5vh,52px);
  }

  /* ---- The arch ---- */
  .arch-wrap{
    position:relative;
    width:var(--aw);
    height:calc(var(--aw) * 1.34);
  }

  .ornament{
    position:absolute; inset:0;
    width:100%; height:100%;
    overflow:visible;          /* fronds fan out past the arch */
    pointer-events:none;
    z-index:0;
  }
  .frond path{
    fill:none;
    stroke:var(--c);
    stroke-width:2.1;
    stroke-linecap:round;
    opacity:.82;
    stroke-dasharray:260;
    stroke-dashoffset:260;
    animation:grow 1.15s cubic-bezier(.22,.68,.3,1) forwards;
  }
  @keyframes grow{ to{ stroke-dashoffset:0 } }

  .arch{
    position:absolute; inset:0;
    z-index:1;
    border-radius:50% 50% 5px 5px / 37% 37% 1.5% 1.5%;
    overflow:hidden;
    background:var(--ground);
    box-shadow:
      0 0 0 1px rgba(245,240,228,.16),
      0 30px 70px -20px rgba(0,0,0,.7);
    opacity:0;
    animation:rise 1.4s cubic-bezier(.16,.84,.3,1) .15s forwards;
  }
  .arch img{
    width:100%; height:100%;
    object-fit:cover;
    object-position:50% 28%;
    display:block;
  }
  /* Warm the photo into the page's own light */
  .arch::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to bottom,
      rgba(242,192,117,.10) 0%,
      rgba(16,36,32,0) 38%,
      rgba(8,21,15,.42) 100%);
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(22px) scale(.97)}
    to  {opacity:1; transform:none}
  }

  /* ---- The line ---- */
  .words{ text-align:center; max-width:min(92vw,640px); }

  h1{
    margin:0;
    font-family:"Fraunces",Georgia,serif;
    font-variation-settings:"opsz" 96,"SOFT" 60,"WONK" 1;
    font-weight:400;
    font-size:clamp(1.65rem,5.4vw,2.6rem);
    line-height:1.16;
    letter-spacing:-.012em;
    color:var(--paper);
  }
  h1 .l{ display:block; overflow:hidden; }
  h1 .l span{
    display:block;
    transform:translateY(110%);
    animation:lift .95s cubic-bezier(.16,.84,.3,1) forwards;
  }
  h1 .l:nth-child(1) span{ animation-delay:.85s }
  h1 .l:nth-child(2) span{ animation-delay:.97s }
  @keyframes lift{ to{ transform:none } }

  /* "soon" picks up the gold of the backlight */
  .soon{
    font-style:italic;
    font-variation-settings:"opsz" 96,"SOFT" 100,"WONK" 1;
    color:var(--sun);
  }

  /* Small rule under the line, echoing a stem */
  .stem{
    display:block;
    width:0; height:1px;
    margin:22px auto 0;
    background:linear-gradient(90deg,
      transparent, rgba(245,240,228,.5), transparent);
    animation:spread 1.1s ease-out 1.35s forwards;
  }
  @keyframes spread{ to{ width:120px } }

  /* Optional: uncomment the names/date block in the HTML below and this styles it */
  .meta{
    margin:16px 0 0;
    font-size:.78rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:rgba(245,240,228,.62);
    opacity:0;
    animation:fade 1s ease-out 1.6s forwards;
  }
  @keyframes fade{ to{ opacity:1 } }

  @media (max-width:560px){
    .frond path{ opacity:.62; stroke-width:2.6 }
  }

  @media (prefers-reduced-motion:reduce){
    .halo,.frond path,.arch,h1 .l span,.stem,.meta{
      animation:none !important;
    }
    .frond path{ stroke-dashoffset:0 }
    .arch,.meta{ opacity:1 }
    h1 .l span{ transform:none }
    .stem{ width:120px }
  }
</style>
</head>
